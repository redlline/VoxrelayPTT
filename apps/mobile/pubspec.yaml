name: voxrelay_mobile
description: "VoxRelay PTT Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.3
  app_links: ^6.3.3
  audio_session: ^0.1.21
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  flutter_webrtc: 0.9.48
  mediasoup_client_flutter: ^0.8.5
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  collection: ^1.18.0
  async: ^2.11.0
  audioplayers: ^6.1.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  mediasoup_client_flutter:
    path: ../../packages/mediasoup_client_flutter

flutter:
  uses-material-design: true
