# NPM / reverse proxy terminates TLS and forwards HTTP — preserve client scheme
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 65;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (for non-proxied responses)
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Rate limiting by IP
  limit_req zone=api burst=40 nodelay;
  limit_conn conn 20;

  # Internal health check — bypasses rate limiting
  location /health {
    access_log off;
    proxy_pass http://voxrelay-server:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/ {
    proxy_pass http://voxrelay-server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
  }

  location /ws {
    proxy_pass http://voxrelay-server:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Static assets with content-hash in name — cache forever
  location ~* ^/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # index.html — never cache so users always get latest JS bundle
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location / {
    # Do not use $uri/ — bare "/" matches the directory and yields 403 without index.html
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
}
