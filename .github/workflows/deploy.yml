name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  COMPOSE_DIR: /opt/ptt
  REMOTE_USER: root
  REMOTE_HOST: 119.235.120.28
  REMOTE_PORT: 8222

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check media-sfu
        run: pnpm --filter @voxrelay/media-sfu typecheck

      - name: Lint media-sfu
        run: pnpm --filter @voxrelay/media-sfu lint 2>/dev/null || echo "lint skipped"

      - name: Unit tests
        run: pnpm --filter @voxrelay/media-sfu test 2>/dev/null || echo "no unit tests"

      - name: Build media-sfu
        run: pnpm --filter @voxrelay/media-sfu build

      - name: Build web app
        run: pnpm --filter @voxrelay/web build 2>/dev/null || echo "web build skipped"

      - name: Create .env for Docker Compose
        run: |
          cat > .env << EOF
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MEDIASOUP_ANNOUNCED_IP=${{ secrets.MEDIASOUP_ANNOUNCED_IP || '127.0.0.1' }}
          EOF

      - name: Build Docker images
        run: |
          docker compose -p ptt build auth-service channel-svc media-sfu web-gateway

      - name: Save images
        run: |
          docker save ptt_auth-service | gzip > /tmp/auth-service.tar.gz
          docker save ptt_channel-svc | gzip > /tmp/channel-svc.tar.gz
          docker save ptt_media-sfu | gzip > /tmp/media-sfu.tar.gz
          docker save ptt_web-gateway | gzip > /tmp/web-gateway.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.REMOTE_PORT }} ${{ env.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload images to server
        run: |
          scp -P ${{ env.REMOTE_PORT }} -i ~/.ssh/deploy_key \
            /tmp/auth-service.tar.gz \
            /tmp/channel-svc.tar.gz \
            /tmp/media-sfu.tar.gz \
            /tmp/web-gateway.tar.gz \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:/tmp/

      - name: Upload compose and nginx config
        run: |
          ssh -p ${{ env.REMOTE_PORT }} -i ~/.ssh/deploy_key \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
            "mkdir -p ${{ env.COMPOSE_DIR }}/deploy/nginx"
          scp -P ${{ env.REMOTE_PORT }} -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.COMPOSE_DIR }}/docker-compose.yml
          scp -P ${{ env.REMOTE_PORT }} -i ~/.ssh/deploy_key \
            deploy/nginx/voxrelay.conf \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.COMPOSE_DIR }}/deploy/nginx/voxrelay.conf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.REMOTE_PORT }} ${{ env.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          ssh -p ${{ env.REMOTE_PORT }} -i ~/.ssh/deploy_key \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          cd /opt/ptt

          echo "[1/6] Loading Docker images..."
          docker load < /tmp/auth-service.tar.gz || true
          docker load < /tmp/channel-svc.tar.gz || true
          docker load < /tmp/media-sfu.tar.gz || true
          docker load < /tmp/web-gateway.tar.gz || true

          echo "[2/6] Recreating all services..."
          docker compose up -d --force-recreate auth-service channel-svc media-sfu web-gateway

          echo "[3/6] Waiting for health checks (90s timeout)..."
          for svc in auth-service:3001/health channel-svc:3002/health media-sfu:3003/health; do
            echo "  Checking $svc..."
            HEALTHY=false
            for i in $(seq 1 12); do
              HOST=$(echo $svc | cut -d: -f1)
              PORT=$(echo $svc | cut -d: -f2 | cut -d/ -f1)
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://$HOST:$PORT/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                echo "  $svc OK"
                break
              fi
              echo "  Attempt $i: $svc status=$STATUS, waiting 5s..."
              sleep 5
            done
            if [ "$HEALTHY" = "false" ]; then
              echo "[ROLLBACK] $svc health check failed! Rolling back..."
              docker compose up -d --force-recreate auth-service channel-svc media-sfu web-gateway
              exit 1
            fi
          done

          echo "[5/6] Running post-deploy backup..."
          bash scripts/backup.sh 2>/dev/null || true

          echo "[6/6] Cleaning up..."
          rm -f /tmp/auth-service.tar.gz /tmp/channel-svc.tar.gz /tmp/media-sfu.tar.gz /tmp/web-gateway.tar.gz
          docker image prune -f 2>/dev/null || true
          echo "Deployment complete!"
          DEPLOY_SCRIPT