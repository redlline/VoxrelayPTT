name: voxrelay

services:
  web-gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      - ../../deploy/nginx/voxrelay.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - channel-svc
      - media-sfu
    mem_limit: 256m
    restart: unless-stopped

  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: voxrelay
      DB_USER: voxrelay
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../../.env
    mem_limit: 128m
    restart: unless-stopped

  channel-svc:
    build:
      context: ../../services/channel-svc
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: voxrelay
      DB_USER: voxrelay
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../../.env
    mem_limit: 128m
    restart: unless-stopped

  media-sfu:
    build:
      context: ../..
      dockerfile: services/media-sfu/Dockerfile
      target: production
    ports:
      - "3003:3003"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}/udp"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40100}/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: voxrelay
      DB_USER: voxrelay
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40100
      MEDIASOUP_NUM_WORKERS: 2
      FLOOR_TIMEOUT_MS: 30000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      TURN_SECRET: ${TURN_SECRET:-}
      HOST: 0.0.0.0
      ADMIN_TLS_APPLY_ENABLED: "true"
      COMPOSE_PROJECT_DIR: /opt/ptt
      ADMIN_TLS_APPLY_COMMAND: docker compose -f infra/compose/production.yml --project-directory /opt/ptt -p ptt exec -T web-gateway sh -lc "nginx -t && nginx -s reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - ../../.env
    mem_limit: 2048m
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: voxrelay
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: voxrelay
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MAX_CLIENT_CONN: 200
    volumes:
      - ../../deploy/init-pgbouncer.sh:/opt/init-pgbouncer.sh:ro
    command: /bin/sh /opt/init-pgbouncer.sh
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: voxrelay
      POSTGRES_USER: voxrelay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxrelay"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn:latest
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "${TURN_MIN_PORT:-49200}-${TURN_MAX_PORT:-49300}:${TURN_MIN_PORT:-49200}-${TURN_MAX_PORT:-49300}/udp"
      - "${TURN_MIN_PORT:-49200}-${TURN_MAX_PORT:-49300}:${TURN_MIN_PORT:-49200}-${TURN_MAX_PORT:-49300}/tcp"
    command:
      - -n
      - --log-file=stdout
      - --realm=voxrelay.local
      - --server-name=voxrelay-turn
      - --lt-cred-mech
      - --user=voxrelay:voxrelay_turn
      - --listening-ip=0.0.0.0
      - --external-ip=119.235.120.28
      - --relay-ip=119.235.120.28
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49200
      - --max-port=49300
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
