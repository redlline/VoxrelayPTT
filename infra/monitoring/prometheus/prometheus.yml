global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/alerts.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3001"]

  - job_name: channel-svc
    static_configs:
      - targets: ["channel-svc:3002"]

  - job_name: media-sfu
    static_configs:
      - targets: ["media-sfu:3003"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nginx
    static_configs:
      - targets: ["web-gateway:80"]
